name: Build SplashText

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          export THEOS=/opt/theos
          brew install ldid
          sudo mkdir -p /opt
          sudo git clone --recursive https://github.com/theos/theos.git $THEOS

      - name: Build package
        run: |
          export THEOS=/opt/theos
          make package FINALPACKAGE=1

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: SplashText-deb
          path: packages/*.deb

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: SplashText-dylib
          path: .theos/obj/debug/SplashText.dylib
